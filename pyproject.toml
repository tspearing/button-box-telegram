[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "message-box"
version = "1.0.0"
description = "Screen-free one-button voice notes for a child, delivered through Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.6,<22",
    "gpiozero>=2.0.1",
]

[project.optional-dependencies]
pi = ["lgpio>=0.2.2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
message-box = "messagebox.__main__:main"

[tool.setuptools.packages.find]
include = ["messagebox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
