# Message Box configuration.
#
# The installer copies this file to /etc/message-box/config.toml if it is
# not already there. Edit that copy on the Pi. Do not put the bot token in
# this file. The token goes in /etc/message-box/env (see .env.example).

[button]
# BCM numbers, not physical pin numbers. BCM 17 is physical pin 11.
# The other switch wire goes to physical pin 9 (GND). Do not use physical pin 17.
pin = 17
pull_up = true
# Ignore switch bounce shorter than this. gpiozero does the same on the pin.
bounce_seconds = 0.05
# Hold at least this long to record. Anything shorter plays the focused chat.
hold_seconds = 0.6
# Audio shorter than this, after the beep, is thrown away.
min_record_seconds = 1.0
# Recording stops itself at this length (3 minutes), even if the button is still held.
max_record_seconds = 180
debounce_seconds = 0.03

[lamp]
# Optional. The Pi cannot power the 12V lamp. This pin drives a transistor.
# Leave a lamp unwired and the box still runs. Set enabled = false to force
# the output off.
enabled = true
# BCM 26 is physical pin 37.
pin = 26
active_high = true
# Short flash every 3 seconds while the focused chat has unheard notes.
unheard_on_seconds = 0.5
unheard_off_seconds = 2.5
# Even blink when only a different chat has unheard notes.
elsewhere_on_seconds = 1
elsewhere_off_seconds = 1
# Recording holds the lamp steady, and only once the microphone is open.
# Older files may still contain waiting, waiting_on_seconds,
# waiting_off_seconds, recording_on_seconds, and recording_off_seconds.
# Those lines are ignored.

[announce]
# piper: offline neural voice. espeak: the older voice, used automatically
# when Piper or this file is missing.
engine = "piper"
piper_voice = "/opt/message-box/voices/en_US-lessac-medium.onnx"
# 1.0 is the model's own speed. Higher is slower, lower is faster.
piper_length_scale = 1.0
# Say who a received note is from, and say "Sent" after Telegram accepts a recording.
announce_sender = true
confirm_sent = true
sent_text = "Sent"
not_sent_text = "Not sent"

# Optional shorter words for people. The key is their Telegram user id.
# [senders]
# 123456789 = "Mom"
# 234567890 = "Dad"
# 345678901 = "Grandma"

[audio]
# "auto" picks a USB mic and a USB speaker, skipping the Pi's headphone and HDMI.
# Or set a device from `arecord -l` / `aplay -l`, for example "plughw:2,0".
# Environment variables MESSAGEBOX_MIC and MESSAGEBOX_SPEAKER override these.
mic_device = "auto"
speaker_device = "auto"
mic_name_hints = ["TONOR", "G11", "USB"]
speaker_name_hints = ["LIELONGREN", "USB Audio", "USB"]
sample_rate = 48000
channels = 1
opus_bitrate = "32k"
# Nudge before every sound, in the same playback. Milliseconds. 0 turns it off.
# noise: very quiet, not digital zero, so a speaker that sleeps until it
# hears a signal can wake up. silence: digital zero, which often does not.
lead_in_ms = 300
lead_in_mode = "noise"
# Loudness of the noise nudge. -60 is 0.001 of full scale.
lead_in_level_db = -60
# A short press when the focused chat has no notes: false = silence, true = a soft tone.
# Notes waiting in other chats are not played.
play_empty_tone = false

[playback]
# While a note is playing, two taps this close together jump backward.
# The second tap rewinds immediately. A single tap during playback does nothing.
# A tap while nothing is playing is not delayed by this window.
rewind_enabled = true
rewind_seconds = 10
double_tap_window_ms = 375

[telegram]
# Only these chats can send notes to the box, and the box will only send to them.
# A family group id is negative. Paste the number /chatid printed.
# Leave this empty until you know the id (see the README, "Get the chat id").
allowed_chat_ids = []
# Uncomment after you know the family group id. If the allowlist has exactly
# one chat, you can leave this line out and that chat is used.
# family_chat_id = CHAT_ID
# Who may send a note into an allowed chat. Positive user ids, not names.
# A private chat with the bot: /chatid replies with that person's user id.
# Listing someone here does not allow a chat that is not in allowed_chat_ids.
# Empty means accept nobody. The installer does not fill this in for you.
allowed_sender_ids = []
# true hears every non-bot person in an allowed chat (the old rule). Off by default.
allow_any_sender = false
# Refuse a download larger than this, or longer than this many seconds when
# Telegram says how long it is. 8388608 is 8 MiB.
max_incoming_bytes = 8388608
max_incoming_seconds = 600

[paths]
data_dir = "/var/lib/message-box"
env_file = "/etc/message-box/env"

[recipient]
# Ignored. A tapped card stays selected until a different card is tapped.
# The key is still read so older config files load.
idle_timeout_seconds = 120

[nfc]
# PN532 on I2C bus 1. Address 36 is 0x24 (i2cdetect prints 24). TOML has no hex.
# enabled = false skips the reader. The box then stays on the default chat.
enabled = true
i2c_bus = 1
i2c_address = 36

# One [[cards]] table per card. There is no fixed limit.
# uid comes from: python -m messagebox --scan-card
# chat_id must be one of allowed_chat_ids. These examples are comments
# because the allowlist above is empty; a real card with a chat id that
# is not on the allowlist is rejected at startup.
# [[cards]]
# uid = "04A1B2C3D4E5F6"
# chat_id = -1000000000001
# Optional. Leave this out and the box speaks the Telegram chat name.
# announce = "German"
# Optional wav played instead of speech.
# announce_file = "/var/lib/message-box/clips/german.wav"
#
# [[cards]]
# uid = "04B1C2D3E4F506"
# chat_id = -1000000000002
# announce = "English"

[dev]
# Laptop keyboard: how long to wait for a repeated SPACE before it counts as a tap.
repeat_window_seconds = 0.7
repeat_gap_seconds = 0.22

[logging]
level = "INFO"
